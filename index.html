<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiNegocio</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17283c;font:16px system-ui}header{background:#123b55;color:white;padding:24px}header h1{margin:0}main{max-width:1000px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button{background:#126b78;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}nav button{background:#123b55}section,article{background:white;padding:20px;border-radius:12px;margin-bottom:16px}h2{margin-top:0}label{display:block;margin:10px 0}input,select{display:block;width:100%;padding:10px;border:1px solid #b6c4ce;border-radius:6px;font:inherit}form{max-width:500px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd} .scroll{overflow:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.cards article{background:#e4f2f2}.cards strong{display:block;font-size:24px}.danger{background:#a43b42}small{color:#526778}</style><header><h1>MiNegocio</h1>Organiza tu emprendimiento en un solo lugar</header><main><nav id="nav"></nav><div id="view"></div><small>Prototipo académico · Datos guardados únicamente en este navegador.</small></main><script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem('minegocio-v1'))||{items:[],sales:[],expenses:[]}}catch{db={items:[],sales:[],expenses:[]}}let page='Inicio',editing=null;const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function save(){localStorage.setItem('minegocio-v1',JSON.stringify(db));render()}function table(head,rows){return '<div class="scroll"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function go(p){page=p;editing=null;render()}function removeItem(i){if(confirm('¿Eliminar este elemento del catálogo? Las ventas anteriores se conservan.')){db.items=db.items.filter(x=>x.id!==i);save()}}function edit(i){editing=i;render()}function render(){let v=$('#view');$('#nav').innerHTML=['Inicio','Catálogo','Ventas','Inventario','Gastos'].map(p=>`<button onclick="go('${p}')">${p}</button>`).join('');let sales=db.sales.reduce((a,x)=>a+x.total,0),expenses=db.expenses.reduce((a,x)=>a+x.amount,0);if(page==='Inicio'){v.innerHTML='<h2>Resumen del negocio</h2><div class="cards">'+[['Ventas',sales],['Gastos',expenses],['Balance registrado',sales-expenses]].map(([t,n])=>`<article>${t}<strong>${money(n)}</strong></article>`).join('')+'</div><section><h2>Actividad</h2><p>'+db.sales.length+' ventas registradas · '+db.items.length+' elementos en catálogo</p><small>El balance es ventas menos gastos registrados; no representa necesariamente utilidad contable.</small></section>';return}if(page==='Catálogo'){let x=db.items.find(x=>x.id===editing)||{name:'',type:'Producto',price:0,stock:0};v.innerHTML=`<section><h2>${editing?'Editar':'Agregar'} producto o servicio</h2><form id="f"><label>Nombre<input name="name" required maxlength="100" value="${esc(x.name)}"></label><label>Tipo<select name="type" id="type"><option ${x.type==='Producto'?'selected':''}>Producto</option><option ${x.type==='Servicio'?'selected':''}>Servicio</option></select></label><label>Precio (COP)<input name="price" type="number" min="0" step="1" required value="${x.price}"></label><label id="stocklabel">Existencias<input name="stock" type="number" min="0" step="1" required value="${x.stock}"></label><button>Guardar</button></form></section><section><h2>Catálogo</h2>${table(['Nombre','Tipo','Precio','Acciones'],db.items.map(x=>[esc(x.name),x.type,money(x.price),`<button onclick="edit('${x.id}')">Editar</button> <button class="danger" onclick="removeItem('${x.id}')">Eliminar</button>`]))}</section>`;let sync=()=>{$('#stocklabel').hidden=$('#type').value==='Servicio'};$('#type').onchange=sync;sync();$('#f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o={id:editing||id(),name:f.get('name').trim(),type:f.get('type'),price:+f.get('price'),stock:f.get('type')==='Servicio'?0:+f.get('stock')};if(!o.name)return;if(editing)db.items=db.items.map(x=>x.id===editing?o:x);else db.items.push(o);editing=null;save()};return}if(page==='Inventario'){v.innerHTML='<section><h2>Existencias de productos</h2>'+table(['Producto','Unidades','Estado'],db.items.filter(x=>x.type==='Producto').map(x=>[esc(x.name),x.stock,x.stock===0?'Agotado':x.stock<=3?'Bajo':'Disponible']))+'</section>';return}if(page==='Ventas'){v.innerHTML=`<section><h2>Registrar venta</h2><form id="f"><label>Producto o servicio<select name="item" required><option value="">Seleccionar</option>${db.items.map(x=>`<option value="${x.id}">${esc(x.name)} — ${money(x.price)}</option>`).join('')}</select></label><label>Cantidad<input name="qty" type="number" min="1" step="1" value="1" required></label><button>Registrar</button></form></section><section><h2>Historial</h2>${table(['Fecha','Concepto','Cantidad','Total'],db.sales.map(x=>[x.date,esc(x.name),x.qty,money(x.total)]))}</section>`;$('#f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x=db.items.find(x=>x.id===f.get('item')),q=+f.get('qty');if(!x)return;if(x.type==='Producto'&&q>x.stock){alert('Existencias insuficientes');return}if(x.type==='Producto')x.stock-=q;db.sales.push({date:new Date().toLocaleDateString('es-CO'),name:x.name,qty:q,total:q*x.price});save()};return}v.innerHTML=`<section><h2>Registrar gasto</h2><form id="f"><label>Concepto<input name="name" required maxlength="100"></label><label>Valor (COP)<input name="amount" type="number" min="1" step="1" required></label><button>Registrar</button></form></section><section><h2>Historial de gastos</h2>${table(['Fecha','Concepto','Valor'],db.expenses.map(x=>[x.date,esc(x.name),money(x.amount)]))}</section>`;$('#f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(!f.get('name').trim())return;db.expenses.push({date:new Date().toLocaleDateString('es-CO'),name:f.get('name').trim(),amount:+f.get('amount')});save()}}render();</script></html>
